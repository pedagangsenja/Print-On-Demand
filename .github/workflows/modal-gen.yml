name: modal-gen
on:
  push:
    branches: ["claude/**"]
    paths: ["designs/svg-typo/ai/queue/*.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: modal-gen-${{ github.ref }}
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q modal potracer pillow numpy
      - name: Generate on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run designs/svg-typo/ai/modal_gen.py
      - name: Vectorize new PNGs
        run: |
          for p in designs/svg-typo/out/*.png; do
            [ -e "$p" ] || continue
            s="${p%.png}.svg"; [ -e "$s" ] || python3 -I designs/svg-typo/ai/vec.py "$p" "$s"
          done
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add designs/svg-typo/out
          git diff --cached --quiet && exit 0
          git commit -m "Add generated designs (Modal)"
          git pull --rebase && git push
